name: Deploy ke Azure Web App - SmartPlant (gibril-input)

on:
  push:
    branches: [gibril-input]
  workflow_dispatch:

permissions:
  contents: read

# Sama dengan workflow main: hanya satu deploy berjalan ke app ini pada satu waktu
concurrency:
  group: azure-webapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hanya berkas situs yang dikirim; tidak ada dependensi, jadi tidak perlu npm install.
      - name: Siapkan paket situs
        run: |
          mkdir site
          cp -r index.html server.js package.json vendor site/

      # Login pakai publish profile (sama seperti main), bukan OIDC azure/login
      # yang gagal karena belum ada federated credential untuk branch ini.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: SmartPlant
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site
